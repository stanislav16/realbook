[project]
name = "realbook"
version = "0.9.38"
description = "Read books aloud with a distinct voice for every character."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.70",
    "pywebview>=6.2.1",
    "kokoro-onnx>=0.6.1",
    "mlx-audio>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "qrcode>=8.2",
    "mlx-lm>=0.32.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "zeroconf>=0.152.0",
]

[project.scripts]
realbook = "realbook.app:main"
realbook-web = "realbook.server:main"
realbook-selftest = "realbook.selftest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realbook"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
