<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>RealBook</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Library -->
  <div id="library" class="view library">
    <aside class="sidebar pywebview-drag-region">
      <div class="sidebar-top pywebview-drag-region"></div>
      <nav class="sidebar-nav pywebview-drag-region">
        <div class="sidebar-label">Library</div>
        <button class="nav-item" data-filter="reading">
          <svg viewBox="0 0 24 24"><path d="M3 5.6c2.7-1.3 5.5-1.2 8 .4v13c-2.5-1.5-5.3-1.6-8-.4v-13Zm10 .4c2.5-1.6 5.3-1.7 8-.4v13c-2.7-1.2-5.5-1.1-8 .4v-13Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Reading Now
        </button>
        <button class="nav-item" data-filter="all">
          <svg viewBox="0 0 24 24"><path d="M4 4.5h3.6v15H4zM9.6 4.5h3.6v15H9.6zM15.4 5.3l3.5-.9 3.2 14.6-3.5.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          All Books
        </button>
        <button class="nav-item" data-filter="finished">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m8 12.3 2.7 2.7L16.2 9.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Finished
        </button>
        <div class="sidebar-label mac-only">Devices</div>
        <button class="nav-item mac-only" data-filter="phone">
          <svg viewBox="0 0 24 24"><rect x="6.5" y="2.8" width="11" height="18.4" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 18h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Listen on iPhone
        </button>
      </nav>
      <div class="sidebar-bottom web-only mac-only">
        <button class="nav-item" data-action="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Settings
        </button>
      </div>
    </aside>
    <main class="library-main">
      <header class="lib-toolbar pywebview-drag-region">
        <h1 id="lib-title" class="pywebview-drag-region">All Books</h1>
        <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
        <label class="button primary" for="file-input" id="add-book">
          <svg viewBox="0 0 24 24" width="13" height="13"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          Add Book
        </label>
        <input type="file" id="file-input" accept=".epub,.txt,.md" hidden>
        <input type="file" id="source-input" accept=".epub,.txt,.md" hidden>
      </header>
      <div class="library-scroll">
        <div id="voice-banner" class="voice-banner hidden"></div>
        <div id="drop" class="drop">Drop a book here to add it</div>
        <div id="continue"></div>
        <div id="books" class="grid"></div>
      </div>
    </main>
  </div>

  <!-- Reader: the book playing, as on the iPhone. Its cover and the line being read, or (Text) the
       whole chapter; the same controls below both. -->
  <div id="reader" class="view reader hidden">
    <div class="np-backdrop" id="np-backdrop"></div>
    <header class="reader-toolbar pywebview-drag-region">
      <div class="tb-group pywebview-drag-region">
        <button class="tb-btn" id="back" title="Library (⌘L)">
          <svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Library</span>
        </button>
      </div>
      <div class="tb-title pywebview-drag-region" id="book-title"></div>
      <div class="tb-group right pywebview-drag-region">
        <button class="round-btn" id="more-btn" title="Cast, text size and theme">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18" cy="12" r="1.7" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <div class="reader-body">
      <aside class="panel left" id="toc">
        <div class="panel-head">Chapters</div>
        <div id="toc-list" class="toc-list"></div>
      </aside>
      <section class="nowplaying" id="nowplaying">
        <div class="np-cover" id="now-cover"></div>
        <div class="np-title" id="np-title"></div>
        <div class="np-chapter" id="now-chapter"></div>
        <div class="np-lines" id="np-lines" title="Show the text">
          <div class="np-side" id="np-before"></div>
          <div class="np-current"><span class="np-who hidden" id="now-speaker"></span><div id="np-line"></div></div>
          <div class="np-side" id="np-after"></div>
        </div>
      </section>
      <article class="page" id="page"></article>
      <aside class="panel right" id="cast">
        <div class="panel-head">
          <span>Cast</span>
          <div class="cast-actions">
            <button class="button small" id="recast" title="Pick voices again for characters you haven't set by hand">Re-cast</button>
            <button class="button small" id="cast-more" title="More">•••</button>
          </div>
        </div>
        <div id="job" class="job hidden"></div>
        <div class="cast-search"><input id="cast-search" class="search-field" type="search" placeholder="Search characters" autocomplete="off" spellcheck="false"></div>
        <div id="cast-list" class="cast-list"></div>
      </aside>
    </div>
    <footer class="player" id="player">
      <div class="scrub">
        <input type="range" id="scrub" min="0" max="0" value="0" step="1" aria-label="Line in this chapter">
        <div class="scrub-labels"><span id="pos-left"></span><span id="pos-right"></span></div>
      </div>
      <div class="player-controls">
        <button class="icon" id="prev" title="Previous line (←)"><svg viewBox="0 0 24 24"><path d="M5 5h2.6v14H5zM9 12l10-7v14z" fill="currentColor"/></svg></button>
        <button class="icon play" id="play" title="Play / pause (space)">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
          <svg id="icon-pause" class="hidden" viewBox="0 0 24 24"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></svg>
        </button>
        <button class="icon" id="next" title="Next line (→)"><svg viewBox="0 0 24 24"><path d="M16.4 5H19v14h-2.6zM15 12 5 19V5z" fill="currentColor"/></svg></button>
      </div>
      <div class="player-row">
        <button class="row-item" id="speed-btn" title="Playback speed"><span class="row-icon"><b id="speed-label">1×</b></span><span>Speed</span></button>
        <button class="row-item" id="sleep-btn" title="Stop playing after a while">
          <span class="row-icon"><svg viewBox="0 0 24 24"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span><span id="sleep-label">Sleep</span>
        </button>
        <button class="row-item" id="text-btn" title="Show the text (⌘3)">
          <span class="row-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10.5h16M4 15h10M4 19.5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span>Text</span>
        </button>
        <button class="row-item" id="toc-btn" title="Chapters (⌘1)">
          <span class="row-icon"><svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="5" cy="6.5" r="1.2" fill="currentColor"/><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="5" cy="17.5" r="1.2" fill="currentColor"/></svg></span><span>Chapters</span>
        </button>
      </div>
    </footer>
  </div>

  <div id="aa-pop" class="popover hidden"></div>
  <div id="menu" class="menu hidden"></div>
  <dialog id="dialog"></dialog>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
